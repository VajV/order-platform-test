syntax = "proto3";

package com.ecommerce.inventory.grpc;

option java_multiple_files = true;
option java_package = "com.ecommerce.inventory.grpc";
option java_outer_classname = "InventoryProtos";

// =============================================
// Inventory Service gRPC API
// =============================================

service InventoryService {
    // Проверить доступность товара
    rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
    
    // Зарезервировать товар
    rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
    
    // Отменить резервирование
    rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
    
    // Получить информацию о запасах
    rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
}

// =============================================
// Check Availability
// =============================================

message CheckAvailabilityRequest {
    string product_id = 1;
    int32 quantity = 2;
}

message CheckAvailabilityResponse {
    bool available = 1;
    int32 available_quantity = 2;
    string message = 3;
}

// =============================================
// Reserve Inventory
// =============================================

message ReserveInventoryRequest {
    string order_id = 1;
    string product_id = 2;
    int32 quantity = 3;
}

message ReserveInventoryResponse {
    bool success = 1;
    string reservation_id = 2;
    string message = 3;
    ReservationStatus status = 4;
}

enum ReservationStatus {
    RESERVATION_STATUS_UNKNOWN = 0;
    RESERVATION_STATUS_CONFIRMED = 1;
    RESERVATION_STATUS_FAILED = 2;
    RESERVATION_STATUS_PARTIAL = 3;
}

// =============================================
// Release Reservation
// =============================================

message ReleaseReservationRequest {
    string reservation_id = 1;
    string order_id = 2;
}

message ReleaseReservationResponse {
    bool success = 1;
    string message = 2;
}

// =============================================
// Get Inventory
// =============================================

message GetInventoryRequest {
    string product_id = 1;
}

message GetInventoryResponse {
    string product_id = 1;
    int32 total_quantity = 2;
    int32 reserved_quantity = 3;
    int32 available_quantity = 4;
}

