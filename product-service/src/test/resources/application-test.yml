spring:
  # Disable OAuth2 Resource Server auto-configuration for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: simple
  
  # H2 in-memory database for tests (no Docker required)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway disabled for tests
  flyway:
    enabled: false
  
  # Kafka mock config
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: product-service-test
      properties:
        spring.json.trusted.packages: "com.ecommerce.*"
    producer:
      properties:
        spring.json.add.type.headers: false
  
  # Disable Vault
  cloud:
    vault:
      enabled: false

  # Disable external config imports
  config:
    import: ""

  # OAuth2 Resource Server mock
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8087

# JWT for tests
jwt:
  secret: TestSecretKeyForUnitTests32Chars!
  expiration: 3600000

# Logging
logging:
  level:
    org.springframework.test: DEBUG
    com.ecommerce.product: DEBUG

# Management endpoints
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    enabled-by-default: false

