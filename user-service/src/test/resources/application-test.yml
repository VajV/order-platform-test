spring:
  # H2 in-memory database for tests (no Docker required)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Flyway disabled for tests
  flyway:
    enabled: false
  
  # Kafka mock config
  kafka:
    bootstrap-servers: localhost:29092
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
      group-id: user-service-test
      properties:
        spring.json.trusted.packages: "com.ecommerce.*"
    producer:
      properties:
        spring.json.add.type.headers: false
  
  # Disable Vault
  cloud:
    vault:
      enabled: false

  # Disable external config imports
  config:
    import: ""

# JWT for tests
jwt:
  secret: TestSecretKeyForUnitTests32Chars!
  expiration: 3600000

# Logging
logging:
  level:
    org.springframework.test: DEBUG
    com.ecommerce.user: DEBUG

# Management endpoints
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    enabled-by-default: false
