spring:
  application:
    name: user-service-test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:29092
    properties:
      schema.registry.url: http://localhost:8081

  h2:
    console:
      enabled: true

jwt:
  secret: test-secret-key-for-testing-only-do-not-use-production
  expiration: 3600000

server:
  port: 0

logging:
  level:
    root: WARN
    com.order.platform: DEBUG
