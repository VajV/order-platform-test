{{- if .Values.orderService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-platform.fullname" . }}-order-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: order
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.orderService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

