{{- if .Values.productService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-platform.fullname" . }}-product-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: product
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.productService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

