apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-platform.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
data:
  # Common configuration
  SPRING_PROFILES_ACTIVE: "k8s"
  LOG_LEVEL: "INFO"
  
  # Infrastructure endpoints
  POSTGRES_HOST: {{ include "order-platform.postgresHost" . | quote }}
  POSTGRES_PORT: "5432"
  MONGODB_HOST: {{ include "order-platform.mongoHost" . | quote }}
  MONGODB_PORT: "27017"
  REDIS_HOST: {{ include "order-platform.redisHost" . | quote }}
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: {{ include "order-platform.kafkaBootstrapServers" . | quote }}
  
  # Service URLs (for inter-service communication)
  AUTH_SERVICE_URL: "http://{{ include "order-platform.fullname" . }}-auth-service:{{ .Values.authService.service.port }}"
  USER_SERVICE_URL: "http://{{ include "order-platform.fullname" . }}-user-service:{{ .Values.userService.service.port }}"
  PRODUCT_SERVICE_URL: "http://{{ include "order-platform.fullname" . }}-product-service:{{ .Values.productService.service.port }}"
  INVENTORY_SERVICE_URL: "http://{{ include "order-platform.fullname" . }}-inventory-service:{{ .Values.inventoryService.service.port }}"
  ORDER_SERVICE_URL: "http://{{ include "order-platform.fullname" . }}-order-service:{{ .Values.orderService.service.port }}"
  NOTIFICATION_SERVICE_URL: "http://{{ include "order-platform.fullname" . }}-notification-service:{{ .Values.notificationService.service.port }}"

