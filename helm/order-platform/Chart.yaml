apiVersion: v2
name: order-platform
description: Event-Driven Order Processing Platform for E-commerce
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - microservices
  - e-commerce
  - order-processing
  - kafka
  - spring-boot

maintainers:
  - name: Order Platform Team
    email: team@order-platform.io

dependencies:
  - name: postgresql
    version: "15.5.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql
  
  - name: mongodb
    version: "14.13.x"
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled
    alias: mongodb
  
  - name: redis
    version: "18.19.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    alias: redis
  
  - name: kafka
    version: "26.11.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
    alias: kafka

