spring:
  # PostgreSQL - используем Testcontainers
  datasource:
    url: jdbc:tc:postgresql:15:///test_inventory_db
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # Flyway отключен для тестов
  flyway:
    enabled: false
  
  # Kafka (встроенный для тестов)
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: inventory-service-test
  
  # Redis для тестов
  data:
    redis:
      host: localhost
      port: 6379
  
  # Отключаем Vault
  cloud:
    vault:
      enabled: false

  # Отключаем импорт внешних конфигов
  config:
    import: ""

# JWT для тестов
jwt:
  secret: TestSecretKeyForUnitTests32Chars!
  expiration: 3600000

# Логирование
logging:
  level:
    org.springframework.test: DEBUG
    org.testcontainers: INFO
    com.ecommerce.inventory: DEBUG

# Отключаем management endpoints в тестах
management:
  endpoints:
    enabled-by-default: false
