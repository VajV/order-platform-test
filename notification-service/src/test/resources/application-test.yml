spring:
  application:
    name: notification-service-test

  # Disable Vault for tests
  cloud:
    vault:
      enabled: false
  config:
    import: ""

  # Disable security for tests (or configure mock)
  security:
    enabled: false

  # MongoDB - uses Flapdoodle embedded MongoDB (no Docker required)
  data:
    mongodb:
      database: notification_db_test
    redis:
      host: localhost
      port: 6379

  # Kafka mock config
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-test
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.ecommerce.*,com.orderplatform.*"
    producer:
      properties:
        spring.json.add.type.headers: false

  # Mail mock
  mail:
    host: localhost
    port: 3025

# Enable embedded MongoDB
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.5

server:
  port: 0

logging:
  level:
    root: WARN
    com.ecommerce.notification: DEBUG

notification:
  rate-limit:
    max-per-hour: 5
    window-seconds: 60
