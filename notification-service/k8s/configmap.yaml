apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: order-platform
data:
  application.yml: |
    spring:
      kafka:
        bootstrap-servers: kafka:9092
        consumer:
          group-id: notification-service
      redis:
        host: redis
        port: "6379"
    
    notification:
      rate-limit:
        max-per-hour: "10"
        window-seconds: "3600"
    
    logging:
      level:
        root: INFO
        com.ecommerce.notification: DEBUG
