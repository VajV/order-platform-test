spring:
  application:
    name: notification-service-test

  # Disable Vault for tests
  cloud:
    vault:
      enabled: false
  config:
    import: ""

  # MongoDB + Redis в одном блоке data
  data:
    mongodb:
      uri: mongodb://localhost:27017/notification_db_test
    redis:
      host: localhost
      port: 6379

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-test
      auto-offset-reset: earliest

  # Mail mock
  mail:
    host: localhost
    port: 3025

server:
  port: 0

logging:
  level:
    root: WARN
    com.ecommerce.notification: DEBUG
    org.testcontainers: INFO

notification:
  rate-limit:
    max-per-hour: 5
    window-seconds: 60
