replicaCount: 3

image:
  tag: "1.0.0"

env:
  springProfilesActive: "prod"
  rateLimitMaxPerHour: "10"

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20

ingress:
  enabled: true
  hosts:
    - host: notification.ecommerce.com
      paths:
        - path: /
          pathType: Prefix
