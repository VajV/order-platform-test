replicaCount: 2

image:
  repository: notification-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8085
  targetPort: 8085

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8085
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  springProfilesActive: "prod"
  kafkaBootstrapServers: "kafka:9092"
  schemaRegistryUrl: "http://schema-registry:8082"
  redisHost: "redis"
  redisPort: "6379"
  rateLimitMaxPerHour: "10"
  rateLimitWindowSeconds: "3600"

mongodb:
  uri: "mongodb://admin:admin@mongodb:27017/notification_db?authSource=admin"

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: notification.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: "notification-service-sa"

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

nodeSelector: {}

tolerations: []

affinity: {}
